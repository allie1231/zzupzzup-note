<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>줍줍문장</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">sentence room</p>
          <h1>줍줍문장</h1>
          <p class="lead">줍줍노트에서 내보낸 문장 CSV를 열고, 읽고, 이유를 덧붙이는 어두운 문장 보관실입니다.</p>
        </div>
        <nav class="nav-actions" aria-label="페이지 이동">
          <a href="../web/">웹홈</a>
          <a href="../mobile-pwa/">모바일</a>
        </nav>
      </header>

      <section class="control-panel">
        <div>
          <p class="eyebrow">CSV</p>
          <h2>문장 CSV 열기</h2>
        </div>
        <div class="actions">
          <button id="connectCsv" class="secondary">CSV 연결</button>
          <label class="file-button">
            CSV 열기
            <input id="csvInput" type="file" accept=".csv,text/csv">
          </label>
          <button id="saveCsv">CSV 저장</button>
        </div>
      </section>

      <p id="status" class="status" role="status">줍줍노트-문장.csv를 열면 문장들이 여기에 나타납니다.</p>

      <section class="add-panel">
        <div>
          <p class="eyebrow">add</p>
          <h2>문장 더하기</h2>
        </div>
        <label>
          문장
          <textarea id="sentenceInput" rows="4" placeholder="새로 줍고 싶은 문장"></textarea>
        </label>
        <label>
          수집한 이유
          <input id="reasonInput" placeholder="왜 남겨두고 싶은지">
        </label>
        <div class="grid">
          <label>
            출처
            <input id="sourceInput" placeholder="https://...">
          </label>
          <label>
            출처 제목
            <input id="titleInput" placeholder="책 제목, 글 제목, 페이지 제목">
          </label>
        </div>
        <label>
          태그
          <input id="tagsInput" placeholder="#문장 #인용">
        </label>
        <button id="addSentence">문장 추가</button>
      </section>

      <section class="notion-panel">
        <div>
          <p class="eyebrow">notion import</p>
          <h2>노션 문장 CSV 매핑</h2>
          <p>노션에서 CSV로 내보낸 문장 DB를 열고, 컬럼을 맞춰 줍줍문장에 합칩니다.</p>
        </div>
        <label class="file-button secondary">
          노션 CSV 열기
          <input id="notionCsvInput" type="file" accept=".csv,text/csv">
        </label>
        <div id="notionMapper" class="mapper" hidden>
          <label>
            문장 컬럼
            <select id="mapSentence"></select>
          </label>
          <label>
            이유 컬럼
            <select id="mapReason"></select>
          </label>
          <label>
            출처 컬럼
            <select id="mapSource"></select>
          </label>
          <label>
            제목 컬럼
            <select id="mapTitle"></select>
          </label>
          <label>
            태그 컬럼
            <select id="mapTags"></select>
          </label>
          <button id="importNotion">매핑해서 가져오기</button>
        </div>
      </section>

      <section class="reader-tools">
        <input id="search" placeholder="문장, 이유, 출처, 태그 검색">
        <button id="showAll" class="secondary">전체</button>
        <button id="shuffleOne" class="secondary">하나 꺼내기</button>
        <strong id="count">0</strong>
      </section>

      <section id="sentences" class="sentences" aria-label="문장 목록"></section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script src="app.js"></script>
  </body>
</html>
