<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>줍줍멤모</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../shared/series-deck.css">
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">quick notes</p>
          <h1>줍줍멤모</h1>
          <p class="lead">흘러가는 생각을 짧게 적어두고, 필요하면 서버 보관함에도 남기는 작은 메모장입니다.</p>
        </div>
        <nav class="nav-actions" aria-label="페이지 이동">
          <a href="../web/">웹홈</a>
          <a href="../mobile-pwa/">모바일</a>
          <a href="../sentences/">줍줍문장</a>
          <a href="../photos/">줍줍사진</a>
          <a href="../dictionary/">줍줍사전</a>
          <a href="../memo/" aria-current="page">줍줍멤모</a>
        </nav>
      </header>

      <section class="cloud-panel">
        <div>
          <p class="eyebrow">Supabase</p>
          <h2>메모 보관함 연결</h2>
          <p>로그인하면 #멤모 태그가 붙은 메모를 Supabase에 저장하고 다시 불러옵니다.</p>
        </div>
        <div class="cloud-grid">
          <label>
            이메일
            <input id="cloudEmail" type="email" placeholder="me@example.com">
          </label>
          <label>
            비밀번호
            <input id="cloudPassword" type="password" placeholder="비밀번호">
          </label>
        </div>
        <details class="cloud-advanced">
          <summary>고급 설정</summary>
          <div class="cloud-grid">
            <label>
              Supabase URL
              <input id="cloudUrl" placeholder="https://xxxx.supabase.co">
            </label>
            <label>
              anon public key
              <input id="cloudAnonKey" placeholder="eyJhbGciOi...">
            </label>
          </div>
        </details>
        <div class="actions">
          <button id="cloudSave" class="secondary">설정 저장</button>
          <button id="cloudLogin">로그인</button>
          <button id="cloudPull" class="secondary">메모 불러오기</button>
          <button id="cloudLogout" class="secondary">로그아웃</button>
        </div>
        <p id="cloudStatus" class="cloud-status" role="status"></p>
      </section>

      <section class="editor">
        <div class="section-head">
          <div>
            <p class="eyebrow">new memo</p>
            <h2>새 메모</h2>
          </div>
          <button id="newMemo" class="secondary" type="button">비우기</button>
        </div>
        <label>
          제목
          <input id="titleInput" placeholder="짧은 제목">
        </label>
        <label>
          메모
          <textarea id="memoInput" rows="8" placeholder="생각, 할 일, 연결할 아이디어"></textarea>
        </label>
        <label>
          태그
          <input id="tagsInput" placeholder="#멤모, #아이디어">
        </label>
        <div class="actions">
          <button id="saveMemo" type="button">메모 저장</button>
          <button id="deleteMemo" class="danger" type="button" hidden>삭제</button>
        </div>
      </section>

      <section class="toolbar">
        <input id="search" placeholder="메모, 제목, 태그 검색">
        <strong id="count">0</strong>
      </section>

      <section id="memoList" class="memo-list" aria-label="메모 목록"></section>

      <nav class="floating-dock" aria-label="빠른 이동">
        <a href="../web/" title="웹홈">⌂</a>
        <a href="../mobile-pwa/" title="모바일">M</a>
        <a href="../sentences/" title="줍줍문장">¶</a>
        <a href="../photos/" title="줍줍사진">▧</a>
        <a href="../dictionary/" title="줍줍사전">#</a>
        <a href="../memo/" aria-current="page" title="줍줍멤모">✎</a>
      </nav>
    </main>
    <script type="module" src="app.js"></script>
    <script type="module" src="../shared/card-toggle.js"></script>
  </body>
</html>
